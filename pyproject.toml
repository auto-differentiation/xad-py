[build-system]
requires = ["scikit-build-core>=0.11", "pybind11-stubgen>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "xad"
version = "1.5.1.3"
description = "High-Performance Automatic Differentiation for Python"
readme = "README.md"
requires-python = ">=3.8.1"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Auto Differentiation Dev Team", email = "dev@auto-differentiation.com" },
]
keywords = [
    "automatic-differentiation",
    "derivatives",
    "machine-learning",
    "optimisation",
    "numerical-analysis",
    "scientific-computing",
    "risk-management",
    "computer-graphics",
    "robotics",
    "biotechnology",
    "meteorology",
    "quant-finance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://auto-differentiation.github.io"
Repository = "https://github.com/auto-differentiation/xad-py"
Documentation = "https://auto-differentiation.github.io/tutorials/python"
Download = "https://pypi.org/project/xad/#files"
Tracker = "https://github.com/auto-differentiation/xad-py/issues"
"Release notes" = "https://github.com/auto-differentiation/xad-py/releases"

[dependency-groups]
test = ["pytest"]
lint = ["black==26.10.1", "flake8==7.4.1", "mypy==2.4.0"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pre-commit"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
wheel.packages = ["xad"]
# submodule parts not needed to build
sdist.exclude = [
    ".github",
    "src/xad/bindings",
    "src/xad/docs",
    "src/xad/samples",
    "src/xad/test",
    "src/pybind11/docs",
    "src/pybind11/tests",
]

[tool.cibuildwheel]
archs = ["native"]  # one arch per runner
skip = ["cp3??t-*", "cp38-macosx_arm64"]  # no free-threaded; cp38 arm64 is cross-compiled (no stubgen)
build-verbosity = 2
test-groups = ["test"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
