# builds only on the following conditions:
# - pull requests into main
# - OR pushes of tags starting with v*
# - OR manual dispatch on repo
# publishes to test pypi if:
# - in auto-differentiation/xad-py repository AND
#   - pushes of tags starting with v*
#   - OR manual dispatch on repo
# publishes to real PyPI if:
# - publish to Test PyPI worked (with all build conditions above)
# - and if it's a version tag (starting with v*)
#
# cibuildwheel settings live in [tool.cibuildwheel] in pyproject.toml.

name: Python Wheels
on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.3
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: SDist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build sdist
        run: pipx run build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-publish:
    needs: [build_wheels, build_sdist]
    if: >-
      github.repository == 'auto-differentiation/xad-py' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xad
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        name: Publish on Test PyPI
        with:
          verbose: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    runs-on: ubuntu-latest
    needs: test-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/xad
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        name: Publish on PyPI
        with:
          verbose: true
          skip-existing: true
